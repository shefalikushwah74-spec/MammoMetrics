[project]
name = "breastcancer-research"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "shefali kushwah", email = "shefalikushwah74@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "groq>=1.7.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "shap>=0.54.1",
    "streamlit>=1.67.0",
]

[project.scripts]
breastcancer-research = "breastcancer_research:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
